{{ if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:

  name: frontend-ingress

  annotations:

    kubernetes.io/ingress.class: alb

    alb.ingress.kubernetes.io/scheme:

      {{ .Values.ingress.scheme }}

spec:

  ingressClassName:

    {{ .Values.ingress.className }}

  rules:

  - http:

      paths:

      - path: /

        pathType: Prefix

        backend:

          service:

            name:

              frontend-service

            port:

              number: 80

{{ end }}